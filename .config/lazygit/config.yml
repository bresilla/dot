customCommands:
  - key: "<c-a>"
    description: "AI commit with type selection and editor"
    context: "files"
    prompts:
      - type: "menu"
        key: "Type"
        title: "Type of change"
        options:
          - name: "build"
            description: "Changes that affect the build system or external dependencies"
            value: "build"
          - name: "feat"
            description: "A new feature"
            value: "feat"
          - name: "fix"
            description: "A bug fix"
            value: "fix"
          - name: "chore"
            description: "Other changes that don't modify src or test files"
            value: "chore"
          - name: "ci"
            description: "Changes to CI configuration files and scripts"
            value: "ci"
          - name: "docs"
            description: "Documentation only changes"
            value: "docs"
          - name: "perf"
            description: "A code change that improves performance"
            value: "perf"
          - name: "refactor"
            description: "A code change that neither fixes a bug nor adds a feature"
            value: "refactor"
          - name: "revert"
            description: "Reverts a previous commit"
            value: "revert"
          - name: "style"
            description: "Changes that do not affect the meaning of the code"
            value: "style"
          - name: "test"
            description: "Adding missing tests or correcting existing tests"
            value: "test"
    command: |
      bash -c '
      SELECTED_TYPE="{{.Form.Type}}";
      diff=$(git diff --cached | head -n 10);
      if [ -z "$diff" ]; then
        echo "No changes in staging. Add changes first.";
        exit 1;
      fi;
      msg=$(aichat "You are an expert at writing Git commits following Conventional Commits format. The user selected type: $SELECTED_TYPE. Generate ONE commit message with this EXACT format: $SELECTED_TYPE: <concise summary under 50 chars>, then empty line, then detailed body with each change on new line starting with dash. Guidelines: Use imperative mood (add, fix, update), be specific about what changed and why. Example: chore: update ESLint configuration (empty line) - Add new rule for unused variables - Remove deprecated parser options. Changes to analyze: $(git diff --cached --stat) $(git diff --cached)");
      echo "$msg" > .git/COMMIT_EDITMSG;
      ${EDITOR:-nvim} .git/COMMIT_EDITMSG;
      if [ -s .git/COMMIT_EDITMSG ]; then
        git commit -F .git/COMMIT_EDITMSG;
      else
        echo "Commit message is empty, commit aborted.";
      fi
      '
    output: terminal

