# yaml-language-server: $schema=https://raw.githubusercontent.com/runkids/skillshare/main/schemas/config.schema.json
sources:
  skills: /home/bresilla/.config/skillshare/skills
  agents: /home/bresilla/.config/skillshare/agents
mode: merge
targets:
  claude:
    skills:
      path: /home/bresilla/.claude/skills
  codex:
    skills:
      path: /home/bresilla/.codex/skills
  universal:
    skills:
      path: /home/bresilla/.agents/skills
ignore:
  - '**/.DS_Store'
  - '**/.git/**'
audit:
  block_threshold: CRITICAL
