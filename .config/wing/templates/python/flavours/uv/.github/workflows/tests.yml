name: tests

on:
  push:
    branches: ["develop", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # The generated project has no oslo, so CI runs the tools directly rather than through
      # .make.lua. The recipes and these steps do the same work by the same commands.
      - name: Verify
        run: |
          nix develop --impure --command bash -c '
          uv sync
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest'
