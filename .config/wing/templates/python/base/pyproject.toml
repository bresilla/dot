[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{kebab_name}}"
version = "0.1.0"
description = "{{PROJECT_NAME}}"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

[project.scripts]
{{kebab_name}} = "{{snake_name}}.__main__:main"

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/{{snake_name}}"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
