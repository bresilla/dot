name: tests

on:
  push:
    branches: ["develop", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # The generated project has no oslo, so CI runs the same commands .make.lua would.
      - name: Verify
        run: |
          nix develop --impure --command bash -c '
          carbon compile --phase=check src/lib.carbon src/main.carbon
          carbon compile --phase=check src/lib.carbon src/lib_test.carbon
          mkdir -p target
          carbon build src/lib.carbon src/lib_test.carbon --output=target/{{kebab_name}}-test
          ./target/{{kebab_name}}-test'
