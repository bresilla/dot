$monitor1 = desc:Samsung Display Corp. 0x414D #laptop
$monitor2 = desc:Samsung Electric Company LS32D70xE HK2X900532
$monitor3 = desc:Samsung Electric Company LS32D70xE HK2Y400739

$monitor5 = desc:Philips Consumer Electronics Company 34B2U5600 UK02425052661 #(ultra wide)
$monitor6 = desc:Philips Consumer Electronics Company PHL 346P1C UK02307049191


$monitor8 = desc:Philips Consumer Electronics Company PHL 241B7Q UHB1916006362  #FTE office
$monitor9 = desc:Philips Consumer Electronics Company PHL 241B7Q UHB1932001606  #FTE office



monitor=,preferred,auto,auto
monitor=$monitor8,1920x1080,3025x1080,1
monitor=$monitor9,1920x1080,1105x1080,1

# monitor=$monitor6,1920x1080,0x1080,1
# monitor=$monitor5,3440x1440,1920x720,1
monitor=$monitor6,3440x1440,0x720,1
monitor=$monitor5,3440x1440,3440x720,1

monitor=$monitor2,3840x2160,0x0,1
monitor=$monitor3,3840x2160,3840x0,1
monitor=$monitor1,3456x2160,2132x2160,1

# Some default env vars.
# env = XDG_CURRENT_DESKTOP, Hyprland
# env = XDG_SESSION_TYPE,wayland
# env = XDG_SESSION_DESKTOP, Hyprland
# env = XCURSOR_SIZE,24
# env = QT_QPA_PLATFORM, wayland

# Running some commands on startup

exec-once = eval $(gnome-keyring-daemon --start)
exec-once = export SSH_AUTH_SOCK
 
exec-once = /env/bin/lule daemon --no-pipe --loop=60 -- start
exec-once = /env/bin/clipse -listen
exec-once = /env/bin/evsieve --input /dev/input/event2 grab --map key:capslock key:f12 --output
exec-once = lemonade server --port=12244 --allow="172.30.0.0/24,0.0.0.0/0,::/0"
exec-once = hyprpm reload -n
exec-once = hyprpaper

exec-once = hyprscratch init


input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:hyper
    kb_rules =
    follow_mouse = 1
    mouse_refocus = false
    float_switch_override_focus = 1
    touchpad {
        natural_scroll = no
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    # col.active_border = rgb(33ccff) rgb(00ff99) 45deg
    # col.active_border = $color1 $color15 45deg
    # col.inactive_border = $color238
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 20
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    # drop_shadow = yes
    # shadow_range = 4
    # shadow_render_power = 20
    # col.shadow = $color0
}

animations {
    enabled = yes
    animation = windows, 1, 20, default, popin
    animation = border, 1, 20, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 4, default, fade
}

dwindle {
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to super + P in the keybinds section below
    preserve_split = yes # you probably want this
}

#master {
#    new_is_master = true
#}

gestures {
    workspace_swipe = on
}

misc {
    force_default_wallpaper = 0 # Set to 0 to disable the anime mascot wallpapers
    # focus_on_activate = true
}


plugin {
    split-monitor-workspaces {
        count = 10
        keep_focused = 1
        enable_notifications = 0
        enable_persistent_workspaces = 1
    }

    borders-plus-plus {
        add_borders = 1 # 0 - 9

        # you can add up to 9 border
        # col.border_1 = rgb(ffffff)
        # col.border_2 = rgb(2222ff)

        # -1 means "default" as in the one defined in general:border_size
        border_size_1 = 2
        border_size_2 = -1

        # makes outer edges match rounding of the parent. Turn on / off to better understand. Default = on.
        natural_rounding = yes
    }
}


#windowrulev2 = nomaximizerequest, class:.*
windowrulev2 = monitor $monitor0,title:note
windowrulev2 = monitor $monitor0,title:main
windowrulev2 = float, class:.*float.*
windowrulev2 = float, class:.*mpv.*
windowrulev2 = float, class:.*scrcpy.*
windowrulev2 = float, class:.*matplotlib.*
windowrulev2 = float, class:.*opencv.*

$super = SUPER
$meta = Alt_L
$hyper = Hyper_L
$menu = Control_R


bind = $super, L, exec, hyprlock

bind = $super_$meta, P, exec, doas chvt 2
bind = $super, Escape, killactive,
bind = $super, Return, exec, kitty --override window_padding_width=0
bind = $meta, Return, exec, kitty


bind = $super, Space, exec, hyprscratch noteing "[float;size 90% 60%;center] kitty --title noteing" eager & hyprctl dispatch centerwindow
bind = $meta, Space, exec, hyprscratch main "[float;size 90% 60%;center] kitty --title main" eager & hyprctl dispatch centerwindow
bind = $super_$meta, Space, exec, hyprscratch appy "[float;size 50% 20%;center] kitty --title appy -e appy"



# Move windows with super and left mouse button
bindm=$super,mouse:272,movewindow
# Resize windows with super and right mouse button
bindm=$meta,mouse:272,resizewindow

# Switch workspaces with mainMod + [0-9]
bind = $super_$meta, Left, exec, hyprctl dispatch workspace r-1
bind = $super_$meta, Right, exec, hyprctl dispatch workspace r+1

# Move windows with super and left/right arrow keys
bind = $super_$meta_SHIFT, Left, exec, hyprctl dispatch movetoworkspace r-1
bind = $super_$meta_SHIFT, Right, exec, hyprctl dispatch movetoworkspace r+1

# Move focus with super + arrow keys
bind = $super, left, movefocus, l
bind = $super, right, movefocus, r
bind = $super, up, movefocus, u
bind = $super, down, movefocus, d

# Swap windows with meta + arrow keys
bind = $meta, left, swapwindow, l
bind = $meta, right, swapwindow, r
bind = $meta, up, swapwindow, u
bind = $meta, down, swapwindow, d

# wndinow 
bind = $super, f, exec, hyprctl dispatch togglefloating
bind = $super, s, exec, hyprctl dispatch fullscreen

# Multimedia keys
binde = , XF86AudioMute, exec, volume_control mute
binde = , XF86AudioRaiseVolume, exec, volume_control up
binde = , XF86AudioLowerVolume, exec, volume_control down
binde = , XF86AudioPlay, exec, playerctl next
# Restart spotifyd
bind = $super_$meta, F4, exec, systemctl --user restart spotifyd
# Beightness control
bind = , XF86MonBrightnessDown, exec, light_control down
bind = , XF86MonBrightnessUp, exec, light_control up

#screenshot
bind = , Insert, exec, capture i

# mpv
bind = $menu, Return, exec, play
bind = $menu, Space, exec, mpv_control cycle
bind = $menu, comma, exec, mpv_control backwards 10
bind = $menu, period, exec, mpv_control forewards 10

#lule wallpaper
bind = $super, Delete, exec, /env/dot/.func/wm/lule_create

#btrop
bind = , F12, exec, hyprscratch hide btop
bindr = , F12, exec, hyprscratch show btop

#systedm-tui
bind = $super_$meta, Return, exec, hyprscratch sdt "[float;size 80% 80%;center] kitty --title sdt -e sdt"
