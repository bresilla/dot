env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

env = LULE_S,/env/dot/.func/wm/lule_colors
env = LULE_C,/home/bresilla/.config/lule/configs.json
env = LULE_W,/env/set/.animegen

source=~/.cache/wal/colors_hypr.conf

$monitor1 = desc:Samsung Display Corp. 0x414D #laptop
$monitor2 = desc:Samsung Electric Company LS32D70xE HK2X900532
$monitor3 = desc:Samsung Electric Company LS32D70xE HK2Y400739

$monitor5 = desc:Philips Consumer Electronics Company 34B2U5600 UK02425052661 #(ultra wide)
$monitor6 = desc:Philips Consumer Electronics Company PHL 346P1C UK02307049191


$monitor8 = desc:Philips Consumer Electronics Company PHL 241B7Q UHB1916006362  #FTE office
$monitor9 = desc:Philips Consumer Electronics Company PHL 241B7Q UHB1932001606  #FTE office

$monitor8 = desc:Philips Consumer Electronics Company PHL 241B6Q UHB1622027491
$monitor9 = desc:Iiyama North America PL2492H 11511116C3061



monitor=,preferred,auto,auto
monitor=$monitor8,1920x1080,3025x1080,1
monitor=$monitor9,1920x1080,1105x1080,1

monitor=$monitor6,3440x1440,0x720,1
monitor=$monitor5,3440x1440,3440x720,1

monitor=$monitor2,3840x2160,0x0,1
monitor=$monitor3,3840x2160,3840x0,1
monitor=$monitor1,3456x2160,2132x2160,1

exec-once = eval $(gnome-keyring-daemon --start)
exec-once = export SSH_AUTH_SOCK
 
exec-once = /env/bin/lule daemon --loop=60 -- start
exec-once = /env/bin/clipse -listen
exec-once = /env/bin/evsieve --input /dev/input/event2 grab --map key:capslock key:f12 --output
exec-once = lemonade server --port=12244 --allow="100.68.0.0/16"
exec-once = hyprpm reload -n
exec-once = /home/bresilla/.config/quickshell/launch.sh
exec-once = hyprpaper
exec-once = hyprctl setcursor "BreezeX-Black" 60
exec-once = hyprscratch init
exec-once = systemctl --user start hyprpolkitagent

debug {
    disable_logs = true
}

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:hyper
    kb_rules =
    follow_mouse = 1
    mouse_refocus = false
    float_switch_override_focus = 1
    touchpad {
        natural_scroll = no
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 3
    col.active_border = $color1
    col.inactive_border = $color237
    layout = dwindle
    # layout = scrolling
    allow_tearing = false
}

decoration {
    rounding = 20
    blur {
        enabled = false
    #     size = 3
    #     passes = 1
    }
    shadow {
            enabled = false
    }
    # screen_shader = /home/bresilla/.config/hypr/shaders/shaders/retro.glsl
}

animations {
    enabled = yes
    animation = windows, 1, 20, default, popin
    animation = border, 1, 20, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 4, default, slidevert
}

dwindle {
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to super + P in the keybinds section below
    preserve_split = yes # you probably want this
}

misc {
    force_default_wallpaper = 0 # Set to 0 to disable the anime mascot wallpapers
    focus_on_activate = true
    disable_scale_notification = true
    vfr = true
}


plugin {
    split-monitor-workspaces {
        count = 10
        keep_focused = 1
        enable_notifications = 0
        enable_persistent_workspaces = 1
    }

    borders-plus-plus {
        add_borders = 1 # 0 - 9
        border_size_1 = 1
        border_size_2 = -1
        natural_rounding = yes
    }
    hyprscrolling {
        column_width = 0.7
        fullscreen_on_one_column = true
    }
}


#windowrulev2 = nomaximizerequest, class:.*
windowrulev2 = monitor $monitor0,title:note
windowrulev2 = monitor $monitor0,title:main
windowrulev2 = float, class:.*float.*
windowrulev2 = float, class:.*mpv.*
windowrulev2 = float, class:.*scrcpy.*
windowrulev2 = float, class:.*matplotlib.*
windowrulev2 = float, class:.*opencv.*
windowrulev2 = float, class:.*Spotify.*

$super = SUPER
$meta = Alt_L
$hyper = Hyper_L
$menu = Control_R


bind = $super, L, exec, hyprlock

bind = $super_$meta, P, exec, doas chvt 2
bind = $super, Escape, killactive,
bind = $super, Return, exec, kitty --override window_padding_width=0
bind = $meta, Return, exec, kitty

bind = $super_$meta, Return, exec, hyprscratch ask "[float;size 80% 80%;center] kitty --title ask -e /env/bin/aichat"


bind = $super, Space, exec, hyprscratch noteing "[float;size 90% 60%;center] kitty --title noteing" eager & hyprctl dispatch centerwindow
bind = $meta, Space, exec, hyprscratch main "[float;size 90% 60%;center] kitty --title main" eager & hyprctl dispatch centerwindow

bind = $super_$meta, Space, exec, hyprscratch browsy "[float;size 60% 20%;center] kitty --title browsy -e browsy"
bind = $super_$meta, B, exec, hyprscratch browsy "[float;size 60% 20%;center] kitty --title browsy -e browsy"
bind = $super_$meta, X, exec, hyprscratch runny "[float;size 60% 20%;center] kitty --title runny -e runny"
bind = $super_$meta, A, exec, hyprscratch appy "[float;size 60% 20%;center] kitty --title appy -e appy"


bind = $super, M, exec, hyprscratch "Spotify" "[float;size 90% 60%;center] flatpak run com.spotify.Client"
bind = $meta, M, exec, hyprscratch "Spotify Premium" "[float;size 90% 60%;center] flatpak run com.spotify.Client"

# gesture
# gesture = 4, vertical, workspace

# Move windows with super and left mouse button
bindm=$super,mouse:272,movewindow
# Resize windows with super and right mouse button
bindm=$meta,mouse:272,resizewindow

# Switch workspaces
bind = $super_$meta, Up, exec, /home/bresilla/.func/hypr/hypr_workspace up
bind = $super_$meta, Down, exec, /home/bresilla/.func/hypr/hypr_workspace down

# Move windows with super and left/right arrow keys
bind = $super_$meta_SHIFT, Up, exec, hyprctl dispatch movetoworkspace r-1
bind = $super_$meta_SHIFT, Down, exec, hyprctl dispatch movetoworkspace r+1

# Move focus with super + arrow keys
bind = $super, left, movefocus, l
bind = $super, right, movefocus, r
bind = $super, up, movefocus, u
bind = $super, down, movefocus, d

# Swap windows with meta + arrow keys
bind = $meta, left, swapwindow, l
bind = $meta, right, swapwindow, r
bind = $meta, up, swapwindow, u
bind = $meta, down, swapwindow, d

# wndinow 
bind = $super, f, exec, hyprctl dispatch togglefloating
bind = $super, s, exec, hyprctl dispatch fullscreen

# Multimedia keys
binde = , XF86AudioMute, exec, pamixer -t
binde = , XF86AudioRaiseVolume, exec, pamixer -i 2
binde = , XF86AudioLowerVolume, exec, pamixer -d 2
binde = , XF86AudioPlay, exec, playerctl next
# Restart spotifyd
bind = $super_$meta, F4, exec, systemctl --user restart spotifyd
# Beightness control
bind = , XF86MonBrightnessDown, exec, light -U 2
bind = , XF86MonBrightnessUp, exec, light -A 2

#screenshot
bind = , Insert, exec, capture i

# mpv
bind = $menu, Return, exec, play
bind = $menu, Space, exec, mpv_control cycle
bind = $menu, comma, exec, mpv_control backwards 10
bind = $menu, period, exec, mpv_control forewards 10

#lule wallpaper
bind = $super_$meta, Delete, exec, /env/dot/.func/wm/lule_create
bind = $super_$meta, Insert, exec, /env/dot/.func/wm/lule_switch

